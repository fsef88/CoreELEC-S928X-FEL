name: Build CoreELEC S928X (dv-fel-s5 optimized)

on:
  push:
    branches:
      - master
      - v1.0-stable-fel-opt
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare Workspace and Script Permissions
        run: |
          chmod -R +x scripts/ tools/
          sudo chown -R 1000:1000 ${{ github.workspace }}

      - name: Build Official CoreELEC Docker Container
        run: |
          docker build -t coreelec tools/docker/noble

      - name: Build CoreELEC Amlogic-no Image
        run: |
          docker run --rm \
            -u 1000:1000 \
            -v ${{ github.workspace }}:/build \
            -w /build \
            -e PROJECT=Amlogic-ce -e DEVICE=Amlogic-no -e ARCH=aarch64 \
            coreelec bash -c "git config --global --add safe.directory /build && make image"

      - name: Restore Permissions for Artifact Upload
        if: always()
        run: |
          sudo chown -R $(id -u):$(id -g) ${{ github.workspace }}

      - name: Dump Failure Logs
        if: failure()
        run: |
          echo "=== FAILED PACKAGE LOGS ==="
          find build.* -name "*.log" 2>/dev/null | head -n 5 | while read f; do
            echo "--- LOG: $f ---"
            tail -n 80 "$f"
          done || true

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build.*/**/.threads/logs/*.log

      - name: Upload Built Image
        uses: actions/upload-artifact@v4
        with:
          name: CoreELEC-Amlogic-no-S928X-P7-FEL-Optimized
          path: |
            target/*.img.gz
            target/*.tar
